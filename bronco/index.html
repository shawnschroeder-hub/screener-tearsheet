<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Yellow Bronco Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>/* Layout: sticky tab strip over ranked listing rows (rank | photo | details | price + View), the Car Board / Truck Board family.
   Palette built around Ford's Yellowstone: a warm paper ground, charcoal ink and one saturated yellow used only where a car is yellow. */
:root{--bg:#F7F4EC;--surface:#FFFEFA;--ink:#1F1D18;--muted:#6B655A;--line:#DCD5C4;--accent:#8A6A00;--accent-ink:#FFFBEA;--accent-soft:#F3EAC8;
--yellow:#FFD83D;--yellow-soft:#FFF3B8;--yellow-line:#E3B800;--good:#2F6B3A;--good-soft:#E1EFE0;--warn:#9A4A00;--warn-soft:#FBE6D2;--new:#2B4F7E;--new-soft:#DDE8F5;
--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17160F;--surface:#221F17;--ink:#EFE9DA;--muted:#A69E8C;--line:#3A3526;--accent:#E7C34A;--accent-ink:#1E1800;--accent-soft:#3A3113;
--yellow:#E3B800;--yellow-soft:#3F3607;--yellow-line:#C9A400;--good:#8FD09A;--good-soft:#1F3323;--warn:#F0B55A;--warn-soft:#3E2E12;--new:#9CC0EA;--new-soft:#1E2E42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17160F;--surface:#221F17;--ink:#EFE9DA;--muted:#A69E8C;--line:#3A3526;--accent:#E7C34A;--accent-ink:#1E1800;--accent-soft:#3A3113;
--yellow:#E3B800;--yellow-soft:#3F3607;--yellow-line:#C9A400;--good:#8FD09A;--good-soft:#1F3323;--warn:#F0B55A;--warn-soft:#3E2E12;--new:#9CC0EA;--new-soft:#1E2E42;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:3.2rem;font-weight:800;text-transform:uppercase} h2{font-size:1.9rem;font-weight:700} h3{font-size:1.35rem;font-weight:700;margin-top:10px} h4{font-size:1.05rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:0} a{color:var(--accent)}
.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:flex;flex-direction:column;gap:8px;border-left:10px solid var(--yellow);padding-left:16px} header p{color:var(--muted);max-width:72ch}
nav{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
nav a{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-weight:600;font-size:.9rem}
nav a:hover{border-color:var(--accent)} nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav a:focus-visible,.btn:focus-visible{outline:3px solid var(--yellow-line);outline-offset:2px}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.verdict{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.verdict.yel{border-top-color:var(--yellow);background:var(--yellow-soft)}
.verdict .big{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.verdict .sub{color:var(--muted);font-size:.9rem}
.panel{display:flex;flex-direction:column;gap:12px}
.note{font-size:.95rem;color:var(--muted);max-width:84ch}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:40px 150px minmax(0,1fr) 150px;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.row.tpick{background:var(--yellow-soft);border-color:var(--yellow-line)}
.rank{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.tpick .rank{background:var(--yellow);color:#1F1D18}
.photo{width:150px;height:112px;object-fit:cover;border-radius:4px;display:block;background:var(--line);max-width:100%}
.nophoto{display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
.mid{min-width:0;display:flex;flex-direction:column;gap:5px}
.name{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.15}
.trim{font-family:var(--body);font-weight:600;color:var(--muted);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.new{background:var(--new-soft);color:var(--new)} .pill.drop{background:var(--yellow-soft);color:var(--ink);border:1px solid var(--yellow-line)}
.facts{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:.9rem;color:var(--muted)} .facts b{color:var(--ink)}
.why{font-size:.9rem;color:var(--ink)} .brk{font-size:.8rem;color:var(--muted)} .brk b{color:var(--ink)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.price{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sub{font-size:.8rem;color:var(--muted)}
.btn{margin-top:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:7px 18px;border-radius:4px;font-size:.9rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card ul,.card ol.plain{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.card.fit{border-top:4px solid var(--accent)} .stars{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:760px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top} th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
footer{color:var(--muted);font-size:.85rem;max-width:84ch}
@media (max-width:680px){
 .row{grid-template-columns:34px minmax(0,1fr)}
 .photo{width:100%;height:auto;aspect-ratio:4/3;grid-column:2}
 .mid{grid-column:2}
 .right{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between}
 h1{font-size:2.4rem}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
.watch{background:var(--surface);border:1px dashed var(--yellow-line);padding:10px 14px;font-size:.93rem;color:var(--muted)} .watch b{color:var(--ink)}
</style>
<div class="wrap" id="app"><p class="note">Loading the board&hellip;</p></div>
<script>
function initTabs(){
 var tabs=[].slice.call(document.querySelectorAll('#tabs a')),panels=[].slice.call(document.querySelectorAll('.panel'));
 function show(k){if(!document.getElementById(k))k='yellow';panels.forEach(function(p){p.hidden=p.id!==k});tabs.forEach(function(a){a.classList.toggle('on',a.dataset.tab===k)});try{localStorage.setItem('broncotab',k)}catch(e){}}
 tabs.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();show(a.dataset.tab);try{history.replaceState(null,'','#'+a.dataset.tab)}catch(err){}window.scrollTo({top:document.getElementById('tabs').offsetTop-8,behavior:'auto'})})});
 var k=location.hash.slice(1);if(!k){try{k=localStorage.getItem('broncotab')}catch(e){}}show(k||'yellow');
}
fetch('board_body.html',{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){document.getElementById('app').innerHTML=h;initTabs()}).catch(function(){document.getElementById('app').innerHTML='<p>The board could not load. Open it again in a moment.</p>'});
</script>
</body></html>
